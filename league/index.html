<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>McFetridge Winter Singles</title><style id="page-css">
/* Layout: one narrow column like a clipboard on a court bench — scoreboard header, tabs, then the sheet. */
:root{
  --bg:#f1f6f6; --surface:#ffffff; --ink:#0f2023; --muted:#506a6e; --line:#d3e1e2;
  --court:#006778; --court-ink:#ffffff; --accent:#006778; --ball:#d7a22a; --win:#1f7a4d; --loss:#a3433a;
  --display:"Saira Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1618; --surface:#122224; --ink:#e3eeef; --muted:#8fa8ab; --line:#223a3d;
  --court:#006778; --court-ink:#ffffff; --accent:#4cc0cf; --ball:#e0b13e; --win:#4cc38a; --loss:#e07a6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1618; --surface:#122224; --ink:#e3eeef; --muted:#8fa8ab; --line:#223a3d;
  --court:#006778; --court-ink:#ffffff; --accent:#4cc0cf; --ball:#e0b13e; --win:#4cc38a; --loss:#e07a6f; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 96px}
.board{background:var(--court);color:var(--court-ink);border-radius:10px;overflow:hidden;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
@supports (overflow:clip){.board{overflow:clip}}
.board-top{padding:16px 20px 16px;cursor:pointer}
.baseline{height:6px;background:#2a8fa0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 10px;white-space:nowrap}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ticker{background:#0b2a30;display:flex;align-items:center;gap:16px;padding:9px 20px;font-size:13px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk-label{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#7fd3de;flex:none}
.tk-item{flex:none;color:#e3eeef}
.ticker .tk-name{color:#fff;font-weight:600;text-decoration-color:rgba(255,255,255,.3)}
.ticker .tk-name:hover{color:var(--ball);text-decoration-color:var(--ball)}
.tk-score{font-family:var(--mono);opacity:.8;margin-left:4px}
.fmtpick{display:flex;flex-wrap:wrap;gap:8px;border:0;margin:0;padding:0}
.fmtpick legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
.fmtpick label{display:flex;align-items:center;gap:6px;font-size:14px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;background:var(--bg)}
.fmtpick label:has(input:checked){border-color:var(--accent);color:var(--accent);font-weight:600}
.setgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 12px;align-items:center;max-width:360px}
.setgrid .h{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.setgrid select{width:100%}
.checks{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.checks label{display:flex;align-items:center;gap:6px}
.logcard textarea{font:14px/1.5 var(--body);padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical;width:100%;box-sizing:border-box}
.note{display:block;font:italic 13px var(--body);color:var(--muted);white-space:normal;text-align:left;margin-top:2px}
.rules dd a.inl{color:var(--accent);font-weight:600}
.news{margin:12px 0 0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:14px}
.news b{color:var(--accent);font-weight:600}
.scorebox{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;line-height:1.6}
.scorebox b{color:var(--ink);font-weight:600;margin-right:6px}
.pnext{display:grid;gap:8px}
.pnext .row2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 10px;background:var(--bg);border-radius:6px}
.pnext .why{font-size:12px;color:var(--muted);text-align:right}
.srows{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srk{text-align:center}
.srk .mv{text-align:center}
.sname{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.sdet{font-size:12px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.spts{font:700 24px var(--display);color:var(--accent);text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.spts span{display:block;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.chipsrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

.formline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:4px 0}
.formline b{color:var(--ink);font-weight:600}
.statsub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.h2hrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
.h2hrow:last-child{border-bottom:0}
.h2hrow .rec{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.h2hrow .pl{font-size:12px;color:var(--muted)}
.vs .wn{font-weight:700;color:var(--ink)}
.vs .ln{color:var(--muted)}
.result .pill{font-size:10px;padding:1px 6px}
.match .note{text-align:left}
.serve{margin:0 12px 10px}
.sv-stage{position:relative;height:270px;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;user-select:none;touch-action:manipulation}
.sv-stage:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}

.sv-stage canvas{position:absolute;left:0;right:0;top:40px;width:100%;height:118px;display:block}
.sv-btn{position:absolute;left:0;right:0;bottom:0;height:106px;display:grid;place-content:center;justify-items:center;gap:3px;border-radius:12px;background:linear-gradient(#0f4650,#0a3239);border:2px solid rgba(223,255,79,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.25);transition:background .12s,border-color .12s;font:700 17px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff;overflow:hidden}
.sv-pw{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(223,255,79,.85)}
.sv-btxt{position:relative;mix-blend-mode:normal;font-size:19px}
.sv-bsub{position:relative;font:500 12.5px var(--body);letter-spacing:0;text-transform:none;color:#cfe3e6;opacity:.9}.sv-bsub:empty{display:none}
.sv-btn.hot .sv-bsub{color:#e9f7c2}
.sv-foot{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px;margin-top:8px;color:#e3f3f5}
.sv-foot label{display:flex;align-items:center;gap:5px}
.sv-foot select{font:12px var(--body);padding:3px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.2);color:#fff;color-scheme:dark}
.sv-best{order:9;flex-basis:100%;opacity:.65;font-family:var(--mono);font-size:11px;margin-top:2px}
.sv-link{font:600 12px var(--body);background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
.sv-foot .sv-link{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid rgba(255,255,255,.3);border-radius:99px;background:rgba(255,255,255,.06);text-decoration:none;line-height:1.1}
.sv-foot .sv-chg{order:1}.sv-foot .sv-rst{order:4}.sv-foot .sv-snd{order:5}.sv-foot .sv-hide{order:6}.sv-foot .sv-help{order:3}
.sv-foot .sv-hide{display:inline-flex;align-items:center;gap:5px;margin-left:auto;padding:6px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font:600 12px var(--body);text-decoration:none;cursor:pointer}
.sv-foot .sv-hide::before{content:'';width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f2ff8a,#d4ec2f 60%,#a9c41a);flex:none}
.serve.collapsed .sv-hide{margin:0 auto;padding:8px 16px;border-color:#dfff4f;background:#dfff4f;color:#0b1f24;font:700 14px var(--body)}
.serve.collapsed .sv-hide::before{width:11px;height:11px}
.serve.collapsed .sv-hide::before{background:#0b4a55}
.serve.collapsed .sv-foot{justify-content:center}
.serve.collapsed .sv-stage,.serve.collapsed .sv-foot label,.serve.collapsed .sv-best,.serve.collapsed .sv-snd,.serve.collapsed .sv-rst,.serve.collapsed .sv-chg{display:none}
.serve.collapsed .sv-foot{margin-top:0}
.sv-btn.hot{background:linear-gradient(#2c5a2a,#21481f);border-color:#dfff4f;box-shadow:inset 0 0 0 1px rgba(223,255,79,.35),0 0 10px rgba(223,255,79,.25)}
.sv-btn:active{transform:scale(.99)}
.sv-arena{position:absolute;left:0;right:0;top:0;height:160px;background:#0a2a30;border-radius:8px}
.sv-bug{position:absolute;left:6px;top:6px;z-index:1;display:grid;gap:1px;background:#0b1f24;border-radius:4px;overflow:hidden;border-left:4px solid #d7a22a;font:600 12px var(--mono);letter-spacing:.04em;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.sv-row{display:grid;grid-template-columns:8px minmax(60px,auto) 16px 32px;align-items:center;gap:7px;padding-left:7px;height:18px;color:#fff;background:#10292f}
.sv-dot{width:6px;height:6px;border-radius:50%;background:#dfff4f;visibility:hidden}
.sv-row.srv .sv-dot{visibility:visible}
.sv-g{text-align:center;opacity:.9}.sv-s{display:none}.sv-bug.mini .sv-row{grid-template-columns:8px minmax(60px,auto) 14px 16px 32px}.sv-bug.mini .sv-s{display:block;text-align:center;color:#dfff4f;font-weight:700}
.sv-p{height:100%;display:grid;place-items:center;background:#1b3b42}
.sv-row.lead .sv-p{background:#dfff4f;color:#0b1f24}
.sv-badge{position:absolute;top:6px;right:6px;z-index:1;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:99px;background:#0b1f24;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.sv-av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--display);letter-spacing:.04em;color:#fff;border:2px solid rgba(255,255,255,.85);box-sizing:border-box}
.sv-bn{display:grid;font:600 11px/1.15 var(--body);color:#cfe3e6;text-align:left}
.sv-pick{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;gap:6px;padding:8px 9px 9px;border-radius:10px;background:#061e22;color:#e3f3f5;overflow:auto;cursor:default}
.sv-pick.show{display:flex}
.sv-toss{position:absolute;left:50%;bottom:31px;transform:translateX(-50%);z-index:4;white-space:nowrap;display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-radius:99px;background:rgba(6,30,34,.92);color:#fff;font:600 13px var(--body);box-shadow:0 2px 10px rgba(0,0,0,.3)}
.sv-toss[hidden]{display:none}
.sv-ask{z-index:9}.sv-toss button.calm{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
.sv-toss button{font:700 13px var(--body);padding:8px 14px;border-radius:99px;border:0;background:#dfff4f;color:#0b1f24;cursor:pointer}
.sv-stage.v-golden .sv-arena{background:linear-gradient(#1b1f4a 0%,#3b2a63 30%,#7a3a6e 55%,#c8534a 80%,#e98a4c 100%)}
.sv-stage.v-day .sv-arena{background:linear-gradient(#1c5aa3 0%,#3f84c9 60%,#76b1e0 100%)}
.sv-stage.v-night .sv-arena{background:linear-gradient(#040814 0%,#0b1533 60%,#182a52 100%)}
.sv-stage.v-dome .sv-arena{background:linear-gradient(#4b5b68 0%,#6f808c 70%,#85949f 100%)}
.sv-stage.v-day .sv-call,.sv-stage.v-golden .sv-call,.sv-stage.v-night .sv-call,.sv-stage.v-dome .sv-call{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.25)}
.sv-stage.picking,.sv-stage.pressing{height:auto;min-height:270px}.sv-stage.picking .sv-pick,.sv-stage.pressing .sv-press{position:relative;inset:auto;overflow:visible;min-height:270px;box-sizing:border-box}
.pk-len{margin:0;flex:none;font:11.5px/1.3 var(--body);color:#a9c9cd}.pk-len b{color:#fff;font-weight:600}
.pk-blurb{margin:0;flex:none;font:11.5px/1.3 var(--body);color:#cfe3e6;min-height:30px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pk-blurb b{color:#fff;font-weight:600}
.sv-pick h4{margin:0;font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff}
.pk-row{display:grid;flex:none;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:5px;padding:1px}
.pk-card{display:grid;justify-items:center;align-content:start;gap:2px;padding:5px 2px 4px;min-width:0;border-radius:9px;border:2px solid rgba(255,255,255,.15);background:#0d2c32;color:#e3f3f5;font:11px/1.2 var(--body);text-align:center;cursor:pointer}

.sv-btn{font-size:16px}

.ms-stamp .rc-big{width:64px;height:64px;padding:0;border-radius:50%;border:4px solid #fff;transform:none;animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both;box-shadow:0 0 0 4px #dfff4f}

.sv-sign{position:absolute;inset:0;z-index:6;display:none;border-radius:10px;overflow:hidden;background:#0b2d33;cursor:crosshair;touch-action:none}

.sg-view{position:absolute;inset:0;transform:scale(1.55);transform-origin:50% 42%;filter:blur(1.6px) saturate(1.15) brightness(.85)}

.sg-view img{position:absolute;left:0;top:40px;width:100%;height:118px}
.sv-sign::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 38%,transparent 46%,transparent 70%,rgba(255,255,255,.07) 75%,transparent 80%)}
.sv-stage .sg-ink{position:absolute;inset:0;top:0;width:100%;height:100%;touch-action:none}
.sg-frame{position:absolute;inset:10px 10px 46px;pointer-events:none;opacity:.75;background:linear-gradient(#fff,#fff) 0 0/16px 2px,linear-gradient(#fff,#fff) 0 0/2px 16px,linear-gradient(#fff,#fff) 100% 0/16px 2px,linear-gradient(#fff,#fff) 100% 0/2px 16px,linear-gradient(#fff,#fff) 0 100%/16px 2px,linear-gradient(#fff,#fff) 0 100%/2px 16px,linear-gradient(#fff,#fff) 100% 100%/16px 2px,linear-gradient(#fff,#fff) 100% 100%/2px 16px;background-repeat:no-repeat}
.sg-rec,.sg-cam{position:absolute;top:16px;pointer-events:none;font:700 11px var(--mono);letter-spacing:.08em;color:#fff;text-shadow:0 1px 2px #000}

.ev-h span{font:600 12px var(--body);color:#dfff4f;text-align:right}
.ev-o{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.ev-o .sv-av{width:38px;height:38px;font-size:14px}
.ev-o b{display:block;font:700 15px var(--display);letter-spacing:.02em;color:#fff}
.ev-o i{display:block;font:600 12px/1.35 var(--body);font-style:normal;color:#9fd0ff}
.ev-p{margin:0;font:13px/1.4 var(--body);color:#cfe3e6}.ev-p b{color:#fff}
.ev-n{margin:0;font:12px/1.4 var(--body);color:#8fb8bd}
.cb{display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr;gap:6px;align-items:center}
.cb-c{display:grid;gap:4px;align-content:center}
.cb-c i{font:700 11px var(--body);font-style:normal;letter-spacing:.06em;text-transform:uppercase;color:#8fb8bd}
.cb-c span{font:600 12px var(--body);color:#e3f3f5;background:#10323a;border-radius:6px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-c span.me{background:#1d3a22;color:#dfff4f;outline:1px solid rgba(223,255,79,.5)}
.cb-c span.tbd{color:#5f8790}
.lb{display:grid;gap:4px}
.lb div{display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border-radius:8px;background:#10323a;font:600 12.5px var(--body);color:#cfe3e6}
.lb b{color:#fff}
.gamelink{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:10px;align-items:center;margin:0 12px 12px;padding:10px 14px;border-radius:10px;background:#dfff4f;color:#0b1f24;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.gamelink span{grid-row:span 2;font-size:22px}.gamelink b{font:700 16px var(--display);letter-spacing:.06em;text-transform:uppercase}.gamelink i{font:500 12px var(--body);font-style:normal;color:#2a3a20}.gamelink em{grid-row:1/span 2;grid-column:3;font:700 22px var(--body);font-style:normal}
.gamelink:hover,.gamelink:focus-visible{background:#ecff8a}
.acct{display:inline-flex;align-items:center;gap:5px;margin-left:auto;font:600 12px var(--body);color:#0b1f24;background:#fff;border:0;border-radius:99px;padding:4px 11px;cursor:pointer}
.acct b{font:800 11px var(--body);background:#ff5a5f;color:#fff;border-radius:99px;padding:0 6px}
.chips{align-items:center}
.reqs{display:grid;gap:4px;font-size:13px}.reqs div{display:flex;justify-content:space-between;gap:10px;padding:6px 9px;border-radius:6px;background:var(--bg)}.reqs i{font-style:normal;color:var(--muted);white-space:nowrap}
.inbox .req{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;display:grid;gap:6px}.req-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.req-h span{font-size:12px;color:var(--muted)}
.inbox pre{margin:0;white-space:pre-wrap;font:13px/1.45 var(--mono);background:var(--bg);padding:8px;border-radius:6px}
.lgtoast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:99px;background:#0b1f24;color:#fff;font:600 14px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.3);text-align:center}

ne":"2709930457"},{"id":"m620f34","name":"Bill J","level":"3.25","phone":"3125433273"}],"matches":[],"updated":"2026-10-16T16:25:46.833Z","upcoming":[]}</script><script id="page-js">

  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const pname = id => (state.players.find(p => p.id === id) || {}).name || 'Removed player';
  const fmtDate = (s, opts) => { if (!s) return ''; const d = new Date(s + 'T12:00:00'); return isNaN(d) ? '' : d.toLocaleDateString('en-US', opts || {weekday:'short', month:'short', day:'numeric'}); };
  const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';

  // Score is a list of sets from Player 1's side: [[8,5]] for a pro set, [[6,4],[3,6],[10,7]] for best of 3 with a super tiebreak, [[4,2],[3,4],[4,1]] for mini tennis.
  function parseSets(str){
    const sets = [...String(str||'').matchAll(/(\d+)\s*[-–:\/]\s*(\d+)/g)].map(x => [+x[1], +x[2]]);

    if (sets.length > 1 && Math.max(wa,wb) !== 2) return null;

  }
  const setsOf = s => s.sets || (s.a != null ? [[+s.a, +s.b]] : null);
  // Points: Win 3 · Close loss 2 · Loss 1 · Forfeit loss 0. Every completed match earns something, so playing more pays off.

    return aWon ? {w:m.a, l:m.b, wg:ga, lg:gb, close, ff:false, sets:view} : {w:m.b, l:m.a, wg:gb, lg:ga, close, ff:false, sets:view};

  const setText = sets => sets.map(([a,b]) => a + '–' + b).join(', ');
  const isMini = m => { const s = m && m.score; if (!s || s.forfeit) return false; if (s.format === 'fast4') return true; const st = setsOf(s); return !!st && st.length >= 2 && !s.retired && st.every(([a,b]) => Math.max(a,b) === 4 && Math.min(a,b) <= 3); };
  const rawText = s => s && !s.forfeit && setsOf(s) ? setsOf(s).map(([a,b]) => a + '-' + b).join(' ') : '';

      const k = [m.a, m.b].sort().join('|'); seen[k] = (seen[k] || 0) + 1;

  }

  const lvlOf = id => { const p = state.players.find(x => x.id === id); const v = p && parseFloat(p.level); return isNaN(v) ? null : v; };
  const playedUp = o => { if (!o || o.ff) return false; const w = lvlOf(o.w), l = lvlOf(o.l); return w != null && l != null && w < l; };
  const initials = n => String(n||'').split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase();
  const AVC = ['#006778','#2b4c7e','#6b3f7a','#a5512a','#2f6b45','#9a2f55','#1f6f9f','#5b5f1f','#4b4fa6','#7a4a2b','#3d6b6b','#8a3b8a'];
  const avColor = id => { const i = state.players.findIndex(p => p.id === id); return AVC[(i < 0 ? 0 : i) % AVC.length]; };
  const avatar = (id, cls) => `<span class="av ${cls||''}" style="background:${avColor(id)}" aria-hidden="true">${esc(initials(pname(id)))}</span>`;

    return `<span class="form" title="Last 5 results, oldest to newest">${res.map(r => `<i class="${r}"></i>`).join('')}</span>`;
  }
  function chrono(){ return state.matches.map((m,i) => ({m,i})).filter(x => outcome(x.m)).sort((x,y) => (x.m.date||'').localeCompare(y.m.date||'') || x.i - y.i).map(x => x.m); }
  function streakOf(id){

  function curStreak(id){ let t = '', n = 0; chrono().forEach(m => { if (m.a !== id && m.b !== id) return; const r = outcome(m).w === id ? 'W' : 'L'; if (r === t) n++; else { t = r; n = 1; } }); return n ? t + n : ''; }
  const streakTag = id => { const n = streakOf(id); return n >= 3 ? `<span class="streak" title="${n} wins in a row">W${n}</span>` : ''; };

      [o.w, o.l].forEach(id => { if (c[id]) { c[id].mp++; c[id].opp.add(id === o.w ? o.l : o.w); } });

      if (playedUp(o) && c[o.w]) c[o.w].giant++;
      if (o.sets.length > 1 && o.sets[0][0] < o.sets[0][1] && c[o.w]) c[o.w].comeback++;

    return [

  const ICONS = {

  const icon = t => ICONS[t] ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[t]}</svg>` : '';
  function renderAwards(){

        <span class="d">${a.d}${a.max ? ' · ' + a.max + ' ' + a.u : ''}</span></div>`).join('')}</div>`;
  }

  function standings(){
    const t = {}, h2h = {}, ok = countedIds();
    state.players.forEach(p => t[p.id] = {id:p.id, name:p.name, mp:0, w:0, l:0, pts:0, gw:0, gl:0, opp:new Set()});
    state.matches.forEach(m => {
      const o = outcome(m); if (!o || !ok.has(m.id) || !t[o.w] || !t[o.l]) return;
      const W = t[o.w], L = t[o.l];
      W.mp++; L.mp++; W.w++; L.l++;
      W.pts += 3 + (playedUp(o) ? 1 : 0); L.pts += o.ff ? 0 : o.close ? 2 : 1;

    const net = (x,y) => (h2h[x+'>'+y] || 0) - (h2h[y+'>'+x] || 0);

    const left = o ? `<div class="vs"><span class="wn">${esc(pname(o.w))}</span><span class="x">d.</span><span class="ln">${esc(pname(o.l))}</span>${editing === m.id ? '' : noteL}</div>`

    let right = !o ? `<span class="pill">No result</span>` : o.ff ? `<span class="pill ff">${esc(pname(o.l))} ${o.reason === 'noshow' ? 'no-show' : o.reason === 'late' ? 'late cancel' : 'forfeit'}</span>` : `${setText(o.sets)} ${isMini(m) ? '<span class="pill">Mini</span> ' : ''}${o.close ? '<span class="pill tb">Close</span>' : ''}${playedUp(o) ? ' <span class="pill tb">Upset +1</span>' : ''}${o.ret ? `<span class="pill">${esc(pname(o.l))} retired</span>` : ''}`;

  function playNext(id, h, rank, rows){
    const me = lvlOf(id), pos = {}, p0 = state.players.find(x => x.id === id) || {}; rows.forEach((r,i) => pos[r.id] = i+1);

      const n = (h[q.id] || {n:0}).n, l = lvlOf(q.id);

      const ov = (q.free || []).filter(k => (p0.free || []).includes(k)).length;
      return {q, n, l, score: n * 10 + ld * 8 + Math.abs((pos[q.id]||rank) - rank) * 0.5 - Math.min(2, ov) * 3};
    }).filter(c => c.n < CAP).sort((a,b) => a.score - b.score).slice(0,3);

      ${rest.length ? `<p class="hint" style="margin:0">Also haven't played: ${rest.map(q => `<button class="plink" data-player="${q.id}">${esc(q.name)}</button>`).join(', ')}</p>` : ''}

  }

  function calLink(u){

      const [h, m] = u.time.split(':').map(Number), hrs = durOf(u);
      const end = new Date(2000, 0, 1, h + hrs, m || 0), pad = n => String(n).padStart(2, '0');
      const endDay = end.getDate() > 1 ? (() => { const d = new Date(u.date + 'T12:00:00'); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10).replace(/-/g, ''); })() : ymd;
      dates = ymd + 'T' + pad(h) + pad(m || 0) + '00/' + endDay + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00';
    } else { const d = new Date(u.date + 'T12:00:00'); d.setDate(d.getDate() + 1); dates = ymd + '/' + d.toISOString().slice(0, 10).replace(/-/g, ''); }

  const FORMATS = [['pro8','8-game pro set'],['pro10','10-game pro set'],['bo3','2 out of 3 sets'],['bo3stb','2 sets + 3rd-set super tiebreak'],['fast4','Mini tennis: 2 out of 3 sets to 4 games']];

    const rows = fmt === 'fast4' ? [['Set 1',4],['Set 2',4],['Set 3',4]] : fmt === 'pro8' ? [['Pro set',9]] : fmt === 'pro10' ? [['Pro set',11]] : [['Set 1',7],['Set 2',7],[fmt === 'bo3stb' ? 'Super TB' : 'Set 3', fmt === 'bo3stb' ? 20 : 7]];
    return `<div class="setgrid"><span></span><span class="h">Winner</span><span class="h">Opponent</span>

  function recapText(){
    const L = state.league, d = new Date(), from = new Date(d); from.setDate(d.getDate() - 6);
    const iso = x => new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10);
    const f = iso(from), t = iso(d), md = x => x.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const wk = chrono().filter(m => m.date >= f && m.date <= t);
    const lines = [`${L.name}: week of ${md(from)} – ${md(d)}`, ''];
    if (wk.length) { lines.push(`Results (${wk.length}):`); wk.forEach(m => { const o = outcome(m); lines.push(`• ${pname(o.w)} d. ${pname(o.l)} ${o.ff ? '(' + (o.reason === 'noshow' ? 'no-show' : o.reason === 'late' ? 'late cancel' : 'forfeit') + ')' : setText(o.sets) + (o.ret ? ' ret.' : '')}`); }); }
    else lines.push('No matches logged this week. Courts are open, get one on the board.');
    const rows = standings().filter(r => r.mp);
    if (rows.length) { lines.push('', 'Top of the standings:'); rows.slice(0,3).forEach((r,i) => lines.push(`${i+1}. ${r.name}, ${r.pts} pts (${r.w}–${r.l})`)); }
    const hot = state.players.map(p => [p.name, streakOf(p.id)]).filter(x => x[1] >= 3);
    if (hot.length) lines.push('', 'On a streak: ' + hot.map(([n,k]) => `${n} (W${k})`).join(', '));
    const aw = awards().filter(a => a.ids.length);
    if (aw.length) lines.push('', 'Award leaders: ' + aw.map(a => `${a.t}: ${a.ids.map(pname).join(' & ')}`).join(' · '));
    const nx = upcomingList();
    if (nx.length) { lines.push('', 'Coming up:'); nx.slice(0,5).forEach(u => lines.push(`• ${fmtDate(u.date,{weekday:'short',month:'numeric',day:'numeric'})}${u.time ? ' ' + fmtSlot(u) : ''}: ${pname(u.a)} ${u.b ? 'vs ' + pname(u.b) : '(open court, needs an opponent)'} at ${u.loc || 'McFetridge'}`)); }
    const idle = state.players.filter(p => !chrono().some(m => m.a === p.id || m.b === p.id));
    if (idle.length) lines.push('', `Still looking for a first match: ${idle.map(p => p.name).join(', ')}`);
    return lines.join('\n');
  }

  function ticker(){
    const recent = state.matches.filter(m => outcome(m)).map((m,i) => ({m,i})).sort((x,y) => (y.m.date||'').localeCompare(x.m.date||'') || y.i - x.i).slice(0, 6);
    if (!recent.length) return '<span class="tk-item">No matches yet. Be the first on the board.</span>';
    return recent.map(({m}) => { const o = outcome(m);
      const sc = o.ff ? (o.reason === 'noshow' ? 'no-show' : o.reason === 'late' ? 'late cancel' : 'forfeit') : o.ret ? setText(o.sets) + ' ret.' : setText(o.sets);
      return `<span class="tk-item"><button class="plink tk-name" data-player="${o.w}">${esc(pname(o.w))}</button> d. <button class="plink tk-name" data-player="${o.l}">${esc(pname(o.l))}</button><span class="tk-score">${esc(sc)}</span></span>`; }).join('');
  }

  function gameHref(){ // the game moved to its own site; anyone who played here takes their progress along
    const u = '../'; try { const sv = localStorage.getItem('mws-tennis-game'); const o = sv && JSON.parse(sv); if (o && (o.xp || o.car || o.played)) return u + '#carry=' + encodeURIComponent(btoa(unescape(encodeURIComponent(sv)))); } catch(_) {} return u; }
  let scene = null; // the game lives on its own site now: https://ntyndorf.github.io/mcfetridge-tour/

  // ---- win odds: an Elo-style rating seeded from NTRP level, updated by every logged result ----
  let RAT = null;
  function ratings(){
    if (RAT) return RAT; const R = {};
    state.players.forEach(p => { const l = parseFloat(p.level); R[p.id] = 1500 + (isNaN(l) ? 0 : (l - 3.25)*400); });
    state.matches.filter(m => outcome(m)).slice().sort((x,y) => (x.date||'').localeCompare(y.date||'')).forEach(m => {
      const o = outcome(m); if (R[o.w] == null || R[o.l] == null) return;
      const e = 1/(1 + Math.pow(10, (R[o.l] - R[o.w])/400)), k = o.ff ? 12 : 32; R[o.w] += k*(1 - e); R[o.l] -= k*(1 - e);
    });
    return (RAT = R);
  }
  const winPct = (a, b) => { const R = ratings(); return Math.round(100/(1 + Math.pow(10, ((R[b] || 1500) - (R[a] || 1500))/400))); };
  function oddsBar(a, b){
    const pa = winPct(a, b), pb = 100 - pa, fa = first(state.players.find(x => x.id === a) || {name: '?'}), fb = first(state.players.find(x => x.id === b) || {name: '?'});
    return `<div class="odds" aria-label="Win odds: ${esc(fa)} ${pa}%, ${esc(fb)} ${pb}%"><div class="obar"><span style="width:${pa}%"></span></div><div class="otxt"><span>${esc(fa)} ${pa}%</span><span>${pb}% ${esc(fb)}</span></div></div>`;
  }

  // ---- self-serve forms: players fill them in, then text or copy the message; the commissioner pastes it in one box ----
  let sheetEl = null;
  const commish = () => { const c = norm(state.league.commissioner || ''); return c ? state.players.find(p => norm(first(p)) === c || norm(p.name) === c) : null; };
  const playerOpts = (sel, blank, skip) => `<option value="">${blank || 'Choose your name'}</option>` + state.players.filter(p => p.id !== skip).map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const mdy = iso => { const [y, m, d] = String(iso).split('-'); return y ? (+m) + '/' + (+d) + '/' + String(y).slice(2) : ''; };
  const clean = v => String(v || '').replace(/[·\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
  function toastLg(t){ const d = document.createElement('div'); d.className = 'lgtoast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); }
  function closeSheet(){ if (sheetEl) { sheetEl.remove(); sheetEl = null; } }
  function openSheet(title, body, build){
    closeSheet();
    sheetEl = document.createElement('div'); sheetEl.className = 'sheetwrap';
    sheetEl.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="sheet-hd"><h3>${esc(title)}</h3><button type="button" class="sheetx" data-close aria-label="Close">×</button></div>
      ${body}<p class="hint sheet-err" aria-live="polite"></p><pre class="msgprev" hidden></pre><div class="acts"></div><p class="hint sheet-note"></p></div>`;
    document.body.appendChild(sheetEl);
    const root = sheetEl.querySelector('.sheet'), errEl = root.querySelector('.sheet-err'), pre = root.querySelector('.msgprev'), acts = root.querySelector('.acts'), note = root.querySelector('.sheet-note');
    let cur = {};
    const refresh = () => {
      cur = build(root) || {};
      errEl.textContent = cur.err || '';
      pre.hidden = !cur.msg || !!cur.err; pre.textContent = cur.msg || '';
      if (!cur.msg || cur.err) { acts.innerHTML = ''; acts.dataset.h = ''; note.textContent = ''; return; }
      const to = cur.to, h = to ? smsHref(to, cur.msg) : '';
      const signed = FBL.user && !art, cn = state.league.commissioner || 'the commissioner';
      const ah = (signed ? `<button type="button" class="btn" data-act="send">Send to ${esc(cn)}</button><button type="button" class="btn ghost" data-act="copy">Copy message</button>` : `<button type="button" class="btn" data-act="copy">Copy message</button>`)
        + (h && !signed ? `<a class="btnl ghost" href="${esc(h)}" target="_top" data-sms="${esc(first(to))}">Text ${esc(first(to))}</a>` : '')
        + (!FBL.user && FBL.ready ? `<button type="button" class="btn ghost" data-acct="1">Sign in to send it to ${esc(cn)}</button>` : '');
      const ah2 = ah + (art && cur.apply ? `<button type="button" class="btn ghost" data-act="apply">Add to site now</button>` : ''); if (acts.dataset.h !== ah2) { acts.dataset.h = ah2; acts.innerHTML = ah2; }
      note.textContent = cur.note || '';
    };
    root.addEventListener('input', refresh); root.addEventListener('change', refresh);
    sheetEl.addEventListener('click', e => {
      if (e.target.closest('[data-close]')) { closeSheet(); return; }
      const a = e.target.closest('a[data-sms]'); if (a) { const href = a.getAttribute('href'), nm = a.dataset.sms; setTimeout(() => { if (document.visibilityState !== 'hidden') smsSheet(href, nm); }, 1200); return; }
      const b = e.target.closest('button[data-act]'); if (!b) return;
      if (b.dataset.act === 'copy') copyText(cur.msg, b);
      if (b.dataset.act === 'send') { b.disabled = true; fbSend(title, cur.msg).then(r => { b.disabled = false; if (r) { errEl.textContent = r; return; } closeSheet(); toastLg('Sent! ' + (state.league.commissioner || 'The commissioner') + ' will approve it, then it shows up for everyone.'); }); return; }
      if (b.dataset.act === 'apply' && cur.apply) { const r = cur.apply(); if (r) { errEl.textContent = r; return; } closeSheet(); markDirty(); }
    });
    refresh();
    const f = root.querySelector('select, input'); if (f && matchMedia('(pointer:fine)').matches) f.focus();
  }
  function sheetScore(){
    const P = state.players;
    openSheet('Report a score', `<p class="hint" style="margin:0">Fill this in, then post the message in the group chat or text it to ${esc(state.league.commissioner || 'the commissioner')}.</p>
      <div class="grid2"><label class="field">Winner<select id="s-w">${playerOpts('', 'Who won?')}</select></label><label class="field">Loser<select id="s-l">${playerOpts('', 'Who lost?')}</select></label></div>
      <div class="grid2"><label class="field">Score, winner's games first<input id="s-sc" placeholder="8-5  or  6-1, 3-6, 10-2  or  4-2, 4-3" autocomplete="off"></label><label class="field">Date<input id="s-d" type="date" value="${today()}"></label></div>`,
      root => {
        const v = id => root.querySelector('#' + id).value.trim(), w = v('s-w'), l = v('s-l'), sc = v('s-sc'), d = v('s-d') || today();
        if (!w || !l) return {err: ''};
        if (w === l) return {err: 'Pick two different players.'};
        if (!sc) return {err: ''};
        const sets = parseSets(sc.replace(/\btb\b/ig, '')); if (!sets) return {err: 'Type the score like 8-5, or 6-1, 3-6, 10-2, or 4-2, 4-3 for mini tennis.'};
        const o = outcome({a: w, b: l, score: {sets}}); if (!o || o.w !== w) return {err: 'Write the score from the winner\'s side (winner\'s games first).'};
        const msg = `${pname(w)} over ${pname(l)}\n${sets.map(([a, b]) => a + '-' + b).join(', ')}\n${mdy(d)}`;
        return {msg, to: commish(), note: 'Winners post the score in the group chat. Once it\'s logged, standings update for everyone.', apply: () => { const r = applyPaste(msg); return r.added ? '' : (r.skipped[0] || 'Could not log that score.'); }};
      });
  }
  function sheetClaim(id){
    const u = (state.upcoming || []).find(x => x.id === id); if (!u) return;
    const when = fmtDate(u.date, {weekday: 'short', month: 'numeric', day: 'numeric'}) + (u.time ? ' ' + fmtSlot(u) : ''), bk = state.players.find(x => x.id === u.a);
    openSheet('Claim this court', `<p style="margin:0"><b>${esc(pname(u.a))}'s court</b> · ${esc(when)} · ${esc(u.loc || 'McFetridge')}</p>

      root => {
        const n = root.querySelector('#c-n').value; if (!n) return {};

        return {msg, to: bk, note: `First to claim gets it. Text ${bk ? first(bk) : 'the booker'} and post it in the group chat, then pay your $16 the same day.`, apply: () => { if (u.b) return 'That court is already claimed.'; u.b = n; return ''; }};
      });
  }
  function sheetFree(pid){
    let last = null;
    openSheet('Update my free times', `<label class="field">Your name<select id="f-n">${playerOpts(pid || '')}</select></label>
      <div class="fpick sheetgrid"><span></span>${FSLOTS.map(([, L]) => `<span class="h">${L.slice(0, 3)}</span>`).join('')}${FDAYS.map(([d, D]) => `<span class="d">${D}</span>${FSLOTS.map(([k, L]) => `<label><input type="checkbox" data-fk="${d}-${k}" aria-label="${D} ${L}"></label>`).join('')}`).join('')}</div>`,
      root => {
        const n = root.querySelector('#f-n').value, boxes = [...root.querySelectorAll('input[data-fk]')];
        if (n !== last) { last = n; const p = state.players.find(x => x.id === n); boxes.forEach(b => b.checked = !!(p && (p.free || []).includes(b.dataset.fk))); }
        if (!n) return {};
        const keys = boxes.filter(b => b.checked).map(b => b.dataset.fk);
        const msg = `🎾 Free times: ${pname(n)} — ${freeText(keys) || 'none'}`;
        return {msg, to: commish(), note: 'Shows up in the Who\'s free grid once it\'s added.', apply: () => { const p = state.players.find(x => x.id === n); if (!p) return 'Player not found.'; if (keys.length) p.free = keys; else delete p.free; return ''; }};
      });
  }
  const PROF = [['plays', 'Plays'], ['bh', 'Backhand'], ['shot', 'Shot'], ['pro', 'Pro'], ['bio', 'Bio']];
  function sheetProfile(pid){
    const p = state.players.find(x => x.id === pid); if (!p) return; const pr = p.prof || {};
    const opt = (v, list) => list.map(x => `<option ${v === x ? 'selected' : ''}>${x}</option>`).join('');
    openSheet('Update profile · ' + p.name, `<div class="grid2"><label class="field">Plays<select id="p-plays"><option value=""></option>${opt(pr.plays, ['Righty', 'Lefty'])}</select></label>
      <label class="field">Backhand<select id="p-bh"><option value=""></option>${opt(pr.bh, ['One-handed', 'Two-handed'])}</select></label></div>
      <div class="grid2"><label class="field">Favorite shot<input id="p-shot" maxlength="40" value="${esc(pr.shot || '')}" placeholder="Inside-out forehand"></label>
      <label class="field">Favorite pro<input id="p-pro" maxlength="40" value="${esc(pr.pro || '')}" placeholder="Alcaraz"></label></div>
      <label class="field">One-line bio<input id="p-bio" maxlength="120" value="${esc(pr.bio || '')}" placeholder="Picked up a racquet again last summer"></label>`,
      root => {
        const vals = {}; PROF.forEach(([k]) => vals[k] = clean(root.querySelector('#p-' + k).value));
        const msg = `🎾 Profile: ${p.name} — ` + PROF.map(([k, L]) => L + ': ' + (vals[k] || '-')).join(' · ');
        return {msg, to: commish(), note: 'Shows on your player page once it\'s added.', apply: () => { setProf(p, vals); return ''; }};

    try { if (A.isSignInWithEmailLink(FBL.auth, location.href)) { let em = ''; try { em = localStorage.getItem('mws-lg-email') || ''; } catch(_) {} if (!em) em = (window.prompt('Confirm your email to finish signing in') || '').trim();
        if (em) { await A.signInWithEmailLink(FBL.auth, em, location.href); try { localStorage.removeItem('mws-lg-email'); } catch(_) {} }
        try { history.replaceState(null, '', location.pathname + location.hash); } catch(_) {} } } catch(_) { FBL.err = 'That sign-in link didn’t work. Send yourself a new one.'; }
    try { await A.getRedirectResult(FBL.auth); } catch(_) {}
    F.onSnapshot(stRef(), snap => { FBL.live = true; if (!snap.exists()) return; const j = (snap.data() || {}).json; if (!j || j === BASE) return; BASE = j; if (dirty) return; try { state = JSON.parse(j); } catch(_) { return; } editing = null; render(); }, () => {});
    A.onAuthStateChanged(FBL.auth, async u => {
      FBL.user = u || null; FBL.admin = !!(u && u.email && ADMIN_EMAILS.includes(u.email.toLowerCase())); art = FBL.admin ? {fb: 1} : null; FBL.me = null; FBL.subs = []; FBL.mine = [];
      if (FBL.unsub) { FBL.unsub(); FBL.unsub = null; }
      if (u) {
        try { const m = await F.getDoc(F.doc(FBL.db, 'members', u.uid)); if (m.exists()) FBL.me = (m.data() || {}).pid || null; } catch(_) {}
        if (FBL.admin) { try { const d = await F.getDoc(stRef()); if (!d.exists()) await F.setDoc(stRef(), {json: BASE, updated: Date.now(), by: u.email}); } catch(_) {} }
        const col = F.collection(FBL.db, 'submissions'), q = FBL.admin ? F.query(col, F.where('status', '==', 'pending')) : F.query(col, F.where('uid', '==', u.uid));
        FBL.unsub = F.onSnapshot(q, s => { const L = []; s.forEach(d => L.push(Object.assign({id: d.id}, d.data()))); L.sort((a, b) => (b.at || 0) - (a.at || 0)); if (FBL.admin) FBL.subs = L; else FBL.mine = L.slice(0, 8); render(); if (sheetEl && sheetEl.dataset.acct) sheetAccount(); }, () => {});
      }
      render(); if (sheetEl && sheetEl.dataset.acct) sheetAccount();
    });
  }
  const meName = () => FBL.me ? pname(FBL.me) : '';
  function acctChip(){
    if (!FBL.ready && !FBL.err) return '';
    const u = FBL.user, n = FBL.admin ? FBL.subs.length : 0;
    return `<button type="button" class="acct" data-acct="1">${u ? `<i aria-hidden="true" style="font-style:normal">👤</i>${esc(FBL.admin ? 'Commissioner' : meName() || 'Signed in')}` : 'Sign in'}${n ? `<b>${n}</b>` : ''}</button>`;
  }
  function sheetAccount(note){
    const u = FBL.user, open = sheetEl && sheetEl.dataset.acct, keep = open ? (sheetEl.querySelector('.lg-em') || {}).value || '' : '';
    closeSheet(); sheetEl = document.createElement('div'); sheetEl.className = 'sheetwrap'; sheetEl.dataset.acct = '1';
    const st = s2 => s2 === 'approved' ? '✅ Approved' : s2 === 'declined' ? '✕ Not added' : '⏳ Waiting for ' + esc(state.league.commissioner || 'the commissioner');
    const body = !FBL.ready ? `<p>${esc(FBL.err || 'Loading sign-in…')}</p>`
      : !u ? `<p style="margin:0">Sign in to send scores, court claims, free times and profile updates straight to ${esc(state.league.commissioner || 'the commissioner')}. Once they're approved, they show up for everyone. No more texting.</p>
        <button type="button" class="btn" data-fb="google">Sign in with Google</button>
        <div class="row"><input class="lg-em" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" aria-label="Your email" value="${esc(keep)}" style="flex:1;min-width:0;font:15px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)"><button type="button" class="btn ghost" data-fb="email">Email me a link</button></div>
        <p class="hint" style="margin:0">Your email is only used to sign you in. Nobody else sees it.</p>`
      : `<p style="margin:0">Signed in as <b>${esc(u.email || u.displayName || 'you')}</b>${FBL.admin ? ' · commissioner' : ''}.</p>
        ${FBL.admin ? `<p class="hint" style="margin:0">${FBL.subs.length ? FBL.subs.length + ' request' + (FBL.subs.length > 1 ? 's' : '') + ' waiting in the Commissioner tab.' : 'No requests waiting.'}</p>` : `<label class="field">Which player are you?<select data-fb-me="1">${playerOpts(FBL.me || '')}</select></label>
        ${FBL.mine.length ? `<div class="reqs"><b>Your requests</b>${FBL.mine.map(r => `<div><span>${esc(r.kind || 'Request')} · ${esc(new Date(r.at || 0).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}))}</span><i>${st(r.status)}</i></div>`).join('')}</div>` : ''}`}
        <button type="button" class="btn ghost" data-fb="out">Sign out</button>`;
    sheetEl.innerHTML = `<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Your account"><div class="sheet-hd"><h3>${u ? 'Your account' : 'Sign in'}</h3><button type="button" class="sheetx" data-close aria-label="Close">×</button></div>${body}<p class="hint sheet-err" aria-live="polite">${esc(note || '')}</p></div>`;
    document.body.appendChild(sheetEl);
    sheetEl.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeSheet(); });
  }
  async function fbAct(k, el){
    const {A, F} = FBL; if (!FBL.ready) return;
    if (k === 'google') { const P = new A.GoogleAuthProvider(); try { await A.signInWithPopup(FBL.auth, P); }
      catch(e) { const c = (e && e.code) || ''; if (/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c)) { try { await A.signInWithRedirect(FBL.auth, P); } catch(_) { sheetAccount('Google sign-in didn’t work here. Try the email link.'); } } else sheetAccount(/popup-closed|cancelled-popup/.test(c) ? '' : 'Google sign-in didn’t work. Try the email link instead.'); } return; }
    if (k === 'email') { const em = ((sheetEl && sheetEl.querySelector('.lg-em') || {}).value || '').trim(); if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { sheetAccount('Type your email address first.'); return; }
      try { await A.sendSignInLinkToEmail(FBL.auth, em, {url: location.origin + location.pathname, handleCodeInApp: true}); try { localStorage.setItem('mws-lg-email', em); } catch(_) {} sheetAccount('Sent! Open the link in ' + em + ' on this device to finish signing in. Check spam if it’s not there.'); }
      catch(_) { sheetAccount('Couldn’t send the link. Check the address and try again.'); } return; }
    if (k === 'out') { try { await A.signOut(FBL.auth); } catch(_) {} closeSheet(); return; }
    if (k === 'me') { const pid = el.value || null; FBL.me = pid; try { await F.setDoc(F.doc(FBL.db, 'members', FBL.user.uid), {pid, name: pid ? pname(pid) : '', email: FBL.user.email || '', at: Date.now()}); } catch(_) {} render(); return; }
  }
  async function fbSend(kind, msg){
    const {F} = FBL; if (!FBL.user) return 'Sign in first.';
    try { await F.addDoc(F.collection(FBL.db, 'submissions'), {uid: FBL.user.uid, email: FBL.user.email || '', pid: FBL.me || '', who: meName(), kind, msg, at: Date.now(), status: 'pending'}); return ''; }
    catch(_) { return 'Couldn’t send that. Check your connection and try again.'; }
  }
  function inboxHtml(){
    if (!FBL.admin) return '';
    const L = FBL.subs;
    return `<div class="card inbox"><h3>Requests from players${L.length ? ` (${L.length})` : ''}</h3>${L.length ? L.map(r => `<div class="req"><div class="req-h"><b>${esc(r.kind || 'Request')}</b><span>${esc(r.who || 'A player')}${r.email ? ' (' + esc(r.email) + ')' : ''} · ${esc(new Date(r.at || 0).toLocaleString('en-US', {month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'}))}</span></div><pre>${esc(r.msg || '')}</pre><div class="row"><button type="button" class="btn" data-ok="${esc(r.id)}">Approve</button><button type="button" class="btn ghost" data-no="${esc(r.id)}">Decline</button><span class="hint" id="rq-${esc(r.id)}"></span></div></div>`).join('') : '<p class="hint">Nothing waiting. When a signed-in player sends a score, court claim, free times or profile update, it lands here.</p>'}</div>`;
  }
  async function reqDo(id, ok){
    const r = FBL.subs.find(x => x.id === id); if (!r) return; const {F} = FBL, msgEl = document.getElementById('rq-' + id);
    if (ok) { const res = applyPaste(r.msg || ''); if (!res.added) { if (msgEl) msgEl.textContent = res.skipped[0] || 'Nothing to add from that request.'; return; } }
    try { await F.updateDoc(F.doc(FBL.db, 'submissions', id), {status: ok ? 'approved' : 'declined', doneAt: Date.now()}); } catch(_) { if (msgEl) msgEl.textContent = 'Couldn’t update that request. Try again.'; return; }
    if (ok) { dirty = true; await save(); }
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('button[data-acct]'); if (a) { sheetAccount(); return; }
    const f = e.target.closest('button[data-fb]'); if (f) { fbAct(f.dataset.fb, f); return; }
    const ok = e.target.closest('button[data-ok]'); if (ok) { ok.disabled = true; reqDo(ok.dataset.ok, true).finally(() => { ok.disabled = false; }); return; }
    const no = e.target.closest('button[data-no]'); if (no) { reqDo(no.dataset.no, false); return; }
  });
  document.addEventListener('change', e => { const s2 = e.target.closest && e.target.closest('select[data-fb-me]'); if (s2) fbAct('me', s2); });
  render();
  fbBoot();
})();
</script></body></html>
